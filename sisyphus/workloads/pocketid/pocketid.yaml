apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketid-data-pvc
  namespace: pocketid
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-config
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketid
  namespace: pocketid
  labels:
    app: pocketid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketid
  # SQLite on a ReadWriteOnce NFS volume. Two pods must never write at the same
  # time, so do not use RollingUpdate and do not raise the replica count.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pocketid
    spec:
      containers:
        - name: pocketid
          image: ghcr.io/pocket-id/pocket-id:v2
          ports:
            - containerPort: 1411
          env:
            - name: PORT
              value: "1411"
            # The public URL. Pocket ID builds OIDC issuer and callback URLs from
            # this value, so it must match the Pangolin domain exactly.
            - name: APP_URL
              value: "https://id.calebbrown.dev"
            # Pangolin (Traefik) sets X-Forwarded-For before the tunnel. HAProxy
            # is mode tcp, so it splices the connection and keeps those headers.
            # The source IP that Pocket ID sees is the HAProxy pod, which is in
            # the cluster pod subnet. Trust that subnet, or the audit log records
            # the pod IP for every login.
            - name: TRUST_PROXY
              value: "10.244.0.0/16"
            # Pangolin terminates TLS, so every real callback URL is https.
            - name: ALLOW_INSECURE_CALLBACK_URLS
              value: "false"
            # Encrypts private keys at rest. Losing this value makes the stored
            # keys unreadable. See sisyphus/workloads/pocketid-secrets/.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocketid-secret
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
          # Pocket ID has no documented health path that this repo depends on, so
          # these probes test the TCP socket. That matches the HAProxy `check`.
          readinessProbe:
            tcpSocket:
              port: 1411
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1411
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocketid-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pocketid
  namespace: pocketid
spec:
  selector:
    app: pocketid
  ports:
    - name: http
      port: 1411
      targetPort: 1411
