apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pocketid
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/cnbrown04/homelab.git
      targetRevision: HEAD
      path: sisyphus/workloads/pocketid
    # ENCRYPTION_KEY lives here as a SOPS-encrypted Secret, decrypted at sync
    # time by the sops-decrypt plugin. This MUST be a sibling dir, not nested
    # under the workload dir: the CMP's discover glob is recursive
    # (**/*.enc.yaml), so an .enc.yaml anywhere beneath the workload path would
    # make ArgoCD detect that whole source as the plugin instead of Kustomize and
    # silently drop the Deployment. Same pattern as wireguard-secrets.
    - repoURL: https://github.com/cnbrown04/homelab.git
      targetRevision: HEAD
      path: sisyphus/workloads/pocketid-secrets
      plugin:
        name: sops-decrypt
  destination:
    server: https://kubernetes.default.svc
    namespace: pocketid
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
