apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketid
  namespace: pocketid
  labels:
    app: pocketid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketid
  # The pod has no volume. State is in PlanetScale Postgres, and uploads go there
  # too via FILE_BACKEND=database. Recreate and 1 replica are kept because this
  # repo has not tested Pocket ID with more than one replica.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pocketid
    spec:
      containers:
        - name: pocketid
          image: ghcr.io/pocket-id/pocket-id:v2.14.0
          ports:
            - containerPort: 1411
          env:
            - name: PORT
              value: "1411"
            # The public URL. Pocket ID builds OIDC issuer and callback URLs from
            # this value, so it must match the Pangolin domain exactly.
            - name: APP_URL
              value: "https://id.calebbrown.dev"
            # Pangolin (Traefik) sets X-Forwarded-For before the tunnel. HAProxy
            # is mode tcp, so it splices the connection and keeps those headers.
            # The source IP that Pocket ID sees is the HAProxy pod, which is in
            # the cluster pod subnet. Trust that subnet, or the audit log records
            # the pod IP for every login.
            - name: TRUST_PROXY
              value: "10.244.0.0/16"
            # Pangolin terminates TLS, so every real callback URL is https.
            - name: ALLOW_INSECURE_CALLBACK_URLS
              value: "false"
            # Encrypts private keys at rest. Losing this value makes the stored
            # keys unreadable. See sisyphus/workloads/pocketid-secrets/.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocketid-secret
                  key: ENCRYPTION_KEY
            # PlanetScale Postgres (us-east-2). The string holds the password, so
            # it lives in the SOPS secret, not here. Port 5432 is the direct port,
            # NOT 6432 (PgBouncer): Pocket ID runs schema migrations at startup,
            # and PlanetScale documents 5432 for DDL and migrations.
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: pocketid-secret
                  key: DB_CONNECTION_STRING
            # Store uploads (logos, profile pictures) in Postgres, not on disk.
            # The nfs-config share is root_squash, so the entrypoint could not
            # chown /app/data and writes there were not reliable. This removes
            # the NFS write path completely.
            - name: FILE_BACKEND
              value: "database"
          # Pocket ID has no documented health path that this repo depends on, so
          # these probes test the TCP socket. That matches the HAProxy `check`.
          readinessProbe:
            tcpSocket:
              port: 1411
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1411
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pocketid
  namespace: pocketid
spec:
  selector:
    app: pocketid
  ports:
    - name: http
      port: 1411
      targetPort: 1411
